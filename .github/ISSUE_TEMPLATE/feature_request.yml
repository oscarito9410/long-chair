name: Feature request
description: A capability Long Chair should grow
title: "[Feature] "
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec Kit link
      description: Path under specs/, or say that a spec is still needed.
      placeholder: specs/002-mobile-app/spec.md
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This does not add an account, a diagnosis, a treatment, or a Qloo key in the client
          required: true
