name: Chore
description: Tooling, dependency, or maintenance work
title: "[Chore] "
labels:
  - infra
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - infra
        - quality
        - docs
        - design
        - feature
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Work
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Gates
      options:
        - label: New dependencies go through check-dep and an exact pin
          required: true
